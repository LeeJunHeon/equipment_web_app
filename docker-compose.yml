services:
  nextjs:
    # GitHub Actions 가 올린 이미지를 deploy 스크립트가 :deployed 로 태그한다(compose 가 스스로 받지 않음).
    # build 는 비상용(sudo ./deploy*.sh --build)으로 남겨 둔다
    image: ghcr.io/leejunheon/equipment-web:deployed
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    container_name: equipment-web-nextjs
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?search_path=equipment
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      AUTH_TRUST_HOST: "true"
      EQUIP_MCP_TOKEN: ${EQUIP_MCP_TOKEN}
      EQUIP_WRITE_TOKEN: ${EQUIP_WRITE_TOKEN}
      EQUIP_CHAT_WEBHOOK_URL: ${EQUIP_CHAT_WEBHOOK_URL:-}
    networks:
      - vanam-db-net

networks:
  vanam-db-net:
    external: true
